    <style>
        :root{ --ivory:#F7F2EA; --espresso:#241D14; --espresso-2:#2E2519; --terracotta:#C7653D; --paper:#FFFDF8; --mushroom:#8D8375; }
        *{ margin:0; box-sizing:border-box; }
        body{ background:var(--espresso); color:var(--ivory); font-family:'Inter',Arial,sans-serif; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 22px; }
        .mark{ font-family:'Cormorant Garamond',Georgia,serif; font-size:34px; letter-spacing:7px; color:var(--ivory); margin-bottom:6px; }
        .mark small{ display:block; font-size:11px; letter-spacing:8px; color:var(--mushroom); margin-top:6px; }
        .star{ color:var(--terracotta); font-size:38px; margin:46px 0 22px; }
        h1{ font-family:'Cormorant Garamond',Georgia,serif; font-weight:500; font-size:clamp(40px,7vw,62px); line-height:1.04; margin-bottom:22px; }
        h1 em{ font-style:italic; color:var(--terracotta); }
        p{ font-weight:300; font-size:16px; line-height:1.8; color:rgba(247,242,234,0.72); max-width:440px; margin:0 auto 14px; }
        p strong{ color:var(--ivory); font-weight:500; }
        .home{ display:inline-flex; align-items:center; gap:9px; margin-top:38px; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--paper); background:var(--terracotta); border:1px solid var(--terracotta); border-radius:999px; padding:16px 32px; text-decoration:none; transition:transform .25s ease; }
        .home:hover{ transform:translateY(-2px); }
        .foot{ margin-top:54px; font-size:12px; letter-spacing:0.06em; color:rgba(247,242,234,0.4); }
        .foot a{ color:var(--terracotta); text-decoration:none; }
    </style>
